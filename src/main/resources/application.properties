spring.application.name=application
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATA_SOURCE}
logging.level.org.hibernate.engine.transaction.jta.platform.internal=WARN
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.ai.openai.api-key=none
spring.jpa.properties.hibernate.transaction.jta.platform=org.springframework.boot.orm.jpa.hibernate.SpringJtaPlatform
nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.base-url=https://integrate.api.nvidia.com/v1
nvidia.api.model=nvidia/nemotron-3-ultra-550b-a55b
spring.security.user.name=${APP_USERNAME}
spring.security.user.password=${APP_PASSWORD}